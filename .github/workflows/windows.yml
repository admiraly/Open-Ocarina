# Open-Ocarina for Windows, made without game data: the Vulkan back end (open-ocarina_vk.dll) compiled with llvm-mingw,
# and the patched source tree a Windows PC builds the game from with its owner's own copy of the game.
# The game executable is not built here and cannot be: it is translated from the game's own code, which stays local.
# The steps follow upstream Hookshot's windows-builder.yml (GPL-3.0, https://github.com/NotRexed/Hookshot) at the
# pinned commit, with patches/hookshot/variant-name.patch applied.
name: Windows build (game-free)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - 'patches/hookshot/variant-name.patch'
      - 'docs/windows.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # (the Hookshot commit patches/hookshot/variant-name.patch is against: docs/variant-name.md)
  HOOKSHOT_REF: 4cf785a0b143bb34026506c9a3fe4f4bb93c797d

jobs:
  windows:
    name: open-ocarina_vk.dll and the Windows source package
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out Hookshot at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: NotRexed/Hookshot
          ref: ${{ env.HOOKSHOT_REF }}
          # (the version is git describe's: the tags and the history since them)
          fetch-depth: 0
          persist-credentials: false
      - name: Check out Open-Ocarina
        uses: actions/checkout@v4
        with:
          path: _oo
          persist-credentials: false
      - name: Apply the variant patch
        run: |
          test "$(git rev-parse HEAD)" = "$HOOKSHOT_REF"
          git apply --index _oo/patches/hookshot/variant-name.patch
          git diff --cached --stat | tail -1
      # (the headers in the CPM cache layout nx2/build.py reads, at the versions upstream's workflow pins)
      - name: Check out pinned Vulkan headers
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: 74d8a6cb930c68ef617b202c3ff3c59d919e086b # v1.4.345
          path: _deps/cpm/vulkanheaders/v1.4.345
          persist-credentials: false
      - name: Check out pinned SPIR-V headers
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: 04f10f650d514df88b76d25e83db360142c7b174 # vulkan-sdk-1.4.341.0
          path: _deps/cpm/spirv-headers/vulkan-sdk-1.4.341.0
          persist-credentials: false
      - name: Check out pinned VulkanMemoryAllocator
        uses: actions/checkout@v4
        with:
          repository: GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator
          ref: 1d8f600fd424278486eade7ed3e877c99f0846b1 # v3.3.0
          path: _deps/cpm/vulkanmemoryallocator/v3.3.0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: llvm-mingw
        run: echo "HOOKSHOT_MINGW=$(python -I scripts/release_parts.py llvm-mingw "$RUNNER_TEMP/llvm")" >> "$GITHUB_ENV"
      - name: Version
        run: |
          tag=$(git describe --tags --long --match 'v[0-9]*' 2>/dev/null || echo "v0.0.0-0-g$(git rev-parse --short HEAD)")
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "version: $tag"
      # (the back end alone, no lift, no game: as upstream's vulkan job builds it)
      - name: open-ocarina_vk.dll
        env:
          RX_VK_ONLY: '1'
          RX_RELEASE: '1'
        run: |
          OOT_WORK="$RUNNER_TEMP/vk-work" RX_CPM="$GITHUB_WORKSPACE/_deps/cpm" \
            python -I nx2/build.py --standalone --jobs "$NUMBER_OF_PROCESSORS"
          ls -l "$RUNNER_TEMP/vk-work/sa/build/open-ocarina_vk.dll"
          sha256sum "$RUNNER_TEMP/vk-work/sa/build/open-ocarina_vk.dll"
      # (the patched tree as git holds it: tracked source only, nothing from a game, no build output)
      - name: Source package
        run: |
          mkdir -p dist
          name="Open-Ocarina-$TAG-windows-source"
          git archive --format=zip --prefix="$name/" -o "dist/$name.zip" "$(git write-tree)"
          cp "$RUNNER_TEMP/vk-work/sa/build/open-ocarina_vk.dll" dist/
          cp _oo/docs/windows.md dist/WINDOWS.md
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: open-ocarina-windows
          path: dist/
          if-no-files-found: error
