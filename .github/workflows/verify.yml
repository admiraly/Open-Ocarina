name: Verify tools and public tree

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run synthetic regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check game-free renderer identity helper
        run: python3 patches/hookshot/check_identity_patch.py --compiler g++
      - name: Check tracked public content
        run: python3 tools/check_public_tree.py
      - name: Check whitespace
        run: git diff --check
